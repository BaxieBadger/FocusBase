<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d472b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nooty – Væg</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5ead8; --surface:#f9f4ed; --surface2:#ebddc5;
    --border:rgba(32,30,29,.16);
    --sidebar-bg:#3d472b; --sidebar-text:#c9d4b3;
    --sage-200:#e1eecc; --sage-500:#8fa073; --sage-600:#728157; --sage-800:#3d472b; --sage-900:#272e1b;
    --accent:#c67139; --accent-light:#ffe1d0;
    --accent2:#7a8a5e; --accent2-light:#e1eecc;
    --danger:#e44258; --danger-light:#fde8eb;
    --warning:#f5a623; --warning-light:#fef3e0;
    --text:#201e1d; --text-muted:#82796a; --text-dim:#a19786;
    --radius:16px; --radius-lg:28px; --radius-pill:999px;
    --font:'Figtree',sans-serif; --font-heading:'Fraunces',serif;
    --shadow-md:0 3px 10px rgba(46,43,37,.16);
    --shadow-lg:0 12px 32px rgba(46,43,37,.22);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--sage-900);overflow:hidden;}
  body{font-family:var(--font); color:var(--text); -webkit-font-smoothing:antialiased; overscroll-behavior:none;}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  #app{
    width:100vw; height:100dvh; background:var(--bg);
    display:flex; flex-direction:column; user-select:none;
    padding-top:var(--safe-t); padding-bottom:var(--safe-b); padding-left:var(--safe-l); padding-right:var(--safe-r);
  }

  /* ── HEADER ── */
  .wall-header{ flex:none; display:flex; align-items:center; gap:20px; background:var(--sage-900); color:#fff;
    padding:0 clamp(14px,2vw,26px); height:clamp(48px,6vh,64px); }
  .wall-logo{ display:flex; align-items:center; gap:8px; }
  .wl-badge{ width:28px; height:28px; border-radius:50%; background:var(--sage-200); color:var(--sage-900);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-weight:900; font-size:14px; }
  .wl-word{ font-size:clamp(14px,1.4vw,18px); font-weight:600; letter-spacing:-0.01em; }
  .wall-tabs{ display:flex; gap:4px; background:rgba(255,255,255,0.08); border-radius:999px; padding:3px; }
  .wall-tab{ border:none; background:none; color:var(--sidebar-text); font-size:clamp(11px,1vw,13px); font-weight:700;
    padding:7px 16px; border-radius:999px; }
  .wall-tab.active{ background:var(--sage-500); color:var(--sage-900); }
  .wall-clock{ margin-left:auto; text-align:right; }
  .wc-time{ font-family:var(--font-heading); font-weight:900; font-size:clamp(16px,1.6vw,22px); display:block; line-height:1.1; }
  .wc-date{ font-size:clamp(9px,0.85vw,11px); color:var(--sidebar-text); text-transform:uppercase; letter-spacing:0.06em; }

  /* ── VIEW SWITCHING ── */
  .wall-content{ flex:1; min-height:0; position:relative; }
  .wall-view{ display:none; height:100%; width:100%; }
  .wall-view.active{ display:flex; }

  @media (max-aspect-ratio: 1/1){
    #view-overview.active{ flex-direction:column; }
    .wall-pills{ flex:0 0 22% !important; width:100% !important; }
    .wall-deck{ flex:0 0 42% !important; }
    .wall-side{ flex:1 !important; width:100% !important; }
  }

  /* ── OVERVIEW: PILL LIST (synkroniseret med deck, index.html-farver) ── */
  .wall-pills{ flex:0 0 24%; min-width:0; display:flex; flex-direction:column; padding:clamp(14px,1.6vw,22px);
    overflow-y:auto; border-right:1px solid var(--border); gap:8px; }
  .wall-panel-title{ font-size:clamp(10px,0.9vw,12px); font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:2px; flex:none; }
  .pill-item{ display:flex; align-items:center; gap:9px; padding:clamp(9px,1vw,12px) clamp(11px,1.2vw,14px);
    border-radius:var(--radius-pill); border:none; text-align:left; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; flex:none; }
  .pill-item.active{ box-shadow:0 0 0 3px var(--sage-900); transform:scale(1.02); }
  .pill-item svg{ flex:none; }
  .pill-item-title{ flex:1; min-width:0; font-size:clamp(11px,1vw,13px); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill-item-date{ font-size:clamp(9px,0.85vw,11px); font-weight:700; opacity:0.85; flex:none; white-space:nowrap; }
  .dl-empty{ font-size:clamp(11px,1vw,13px); color:var(--text-muted); padding:16px 0; text-align:center; }

  /* ── OVERVIEW: SWIPEABLE DECK ── */
  .wall-deck{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; padding:clamp(14px,1.8vw,26px); overflow:hidden; }
  .deck-head{ display:flex; align-items:center; margin-bottom:10px; flex:none; }
  .deck-pos{ font-size:clamp(10px,0.9vw,12px); font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); }
  .deck-dots{ margin-left:auto; display:flex; gap:5px; flex-wrap:wrap; max-width:50%; justify-content:flex-end; }
  .deck-dot{ width:7px; height:7px; border-radius:999px; background:var(--surface2); border:none; padding:0; cursor:pointer; }
  .deck-dot.active{ background:var(--accent); }
  .deck-swipe{ flex:1; min-height:0; touch-action:pan-y; cursor:grab; overflow:hidden; }
  .deck-swipe:active{ cursor:grabbing; }
  .deck-card{ height:100%; border-radius:var(--radius-lg); padding:clamp(20px,3vw,40px); display:flex; flex-direction:column;
    gap:12px; box-shadow:var(--shadow-md); transition:transform .22s ease; color:var(--text); overflow-y:auto; }
  .deck-card.dragging{ transition:none; }
  .deck-card-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:none; }
  .deck-chip{ font-size:clamp(10px,1vw,13px); font-weight:700; padding:4px 13px; border-radius:999px; white-space:nowrap;
    background:rgba(0,0,0,0.13); display:inline-flex; align-items:center; gap:5px; }
  .deck-chip-high{ background:var(--danger); color:#fff; }
  .deck-date{ margin-left:auto; font-size:clamp(12px,1.2vw,16px); font-weight:700; opacity:0.85; }
  .deck-date.late{ color:var(--danger); opacity:1; }
  .deck-title{ font-family:var(--font-heading); font-weight:900; font-size:clamp(24px,3vw,40px); line-height:1.1; flex:none; }
  .deck-desc{ font-size:clamp(12px,1.1vw,15px); line-height:1.5; opacity:0.85; flex:none; }
  .deck-parent{ font-size:clamp(11px,1vw,13px); opacity:0.75; flex:none; }
  .deck-subtasks{ background:rgba(0,0,0,0.07); border-radius:var(--radius); padding:10px 14px; flex:none; }
  .deck-subtasks-title{ font-size:clamp(9px,0.85vw,11px); font-weight:700; letter-spacing:0.06em; text-transform:uppercase; opacity:0.7; margin-bottom:6px; }
  .deck-subtask-row{ display:flex; align-items:center; gap:8px; padding:3px 0; font-size:clamp(11px,1vw,13px); }
  .deck-subtask-row.done{ opacity:0.55; text-decoration:line-through; }
  .deck-subtask-dot{ width:9px; height:9px; border-radius:3px; border:1.5px solid currentColor; flex:none; }
  .deck-subtask-dot.on{ background:currentColor; }
  .deck-done-btn{ align-self:flex-start; border:none; border-radius:999px; padding:10px 22px; font-size:clamp(12px,1.1vw,14px);
    font-weight:700; background:rgba(0,0,0,0.14); color:var(--text); margin-top:auto; flex:none; }
  .deck-done-btn:hover{ background:rgba(0,0,0,0.22); }
  .deck-empty{ height:100%; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--text-muted);
    background:var(--surface); border-radius:var(--radius-lg); }

  /* ── OVERVIEW: HØJRE SIDE — SoMe (2 kolonner) + Indbakke ── */
  .wall-side{ flex:0 0 30%; min-width:0; display:flex; flex-direction:column; border-left:1px solid var(--border); }
  .wall-some-cols{ flex:0 0 50%; min-height:0; overflow-y:auto; padding:clamp(14px,1.6vw,20px); border-bottom:1px solid var(--border); }
  .some-cols-row{ display:flex; gap:14px; margin-top:8px; }
  .some-col{ flex:1; min-width:0; }
  .some-col-title{ font-size:clamp(10px,0.9vw,12px); font-weight:700; color:var(--text-muted); margin-bottom:6px; }
  .some-list-item{ display:flex; align-items:center; gap:7px; padding:5px 0; border-bottom:1px solid var(--border); }
  .some-list-item:last-child{ border-bottom:none; }
  .some-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .some-item-body{ flex:1; min-width:0; }
  .some-item-title{ font-size:clamp(10px,0.95vw,12px); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .some-item-sub{ font-size:clamp(8px,0.75vw,10px); color:var(--text-muted); }
  .some-item-date{ font-size:clamp(8px,0.75vw,10px); color:var(--text-muted); flex:none; }

  .wall-inbox{ flex:1; min-height:0; overflow-y:auto; padding:clamp(14px,1.6vw,20px); }
  .inbox-count-badge{ background:var(--accent); color:#fff; font-size:10px; font-weight:700; padding:1px 8px; border-radius:999px; margin-left:6px; }
  .inbox-item{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .inbox-item:last-child{ border-bottom:none; }
  .inbox-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }
  .inbox-item-title{ font-size:clamp(11px,1vw,13px); color:var(--text); }

  /* ── POMODORO: FAB + POPUP ── */
  .pm-fab{ position:fixed; bottom:calc(24px + var(--safe-b)); right:calc(24px + var(--safe-r)); z-index:80;
    width:60px; height:60px; border-radius:50%; border:none; background:var(--accent); color:#fff;
    font-size:24px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-lg); }
  .pm-fab:hover{ background:#b2622d; }
  .pomodoro-overlay{ position:fixed; inset:0; background:color-mix(in srgb, var(--sage-900) 55%, transparent); z-index:90;
    display:none; align-items:center; justify-content:center; }
  .pomodoro-overlay.open{ display:flex; }
  .pomodoro-modal{ position:relative; background:var(--sage-800); color:#fff; border-radius:var(--radius-lg);
    padding:clamp(28px,4vw,48px); width:min(480px,90vw); display:flex; flex-direction:column; align-items:center; gap:14px; box-shadow:var(--shadow-lg); }
  .pm-modal-close{ position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.12); color:#fff; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .pm-modal-close:hover{ background:rgba(255,255,255,0.22); }
  .pm-label{ font-size:clamp(13px,1.3vw,17px); font-weight:700; letter-spacing:0.04em; color:var(--sidebar-text); text-align:center; }
  .pm-focus-task{ display:none; width:100%; padding:12px 16px; background:rgba(255,255,255,0.08);
    border-radius:var(--radius); border-left:4px solid var(--accent); }
  .pm-focus-task .pm-ft-label{ font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--sidebar-text); margin-bottom:4px; }
  .pm-focus-task .pm-ft-name{ font-size:clamp(13px,1.2vw,16px); font-weight:600; color:#fff; line-height:1.3; }
  .pm-focus-task .pm-ft-proj{ font-size:clamp(11px,1vw,12px); color:var(--sidebar-text); margin-top:2px; }
  .pm-focus-task .pm-ft-deadline{ font-size:clamp(11px,1vw,12px); font-weight:700; margin-top:4px; }
  .pm-display{ font-family:var(--font-heading); font-weight:900; font-size:clamp(64px,9vw,120px); line-height:1;
    font-variant-numeric:tabular-nums; color:#fff; }
  .pm-pressure-wrap{ display:none; width:100%; height:6px; background:rgba(255,255,255,0.14); border-radius:3px; overflow:hidden; }
  .pm-pressure-bar{ height:100%; width:100%; background:var(--accent2); transition:width 1s linear,background 1s; }
  .pm-controls{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .pm-btn{ border:none; border-radius:var(--radius-pill); padding:11px 22px; font-size:clamp(12px,1.1vw,15px); font-weight:700;
    background:rgba(255,255,255,0.12); color:#fff; }
  .pm-btn:hover{ background:rgba(255,255,255,0.2); }
  .pm-btn.primary{ background:var(--accent); }
  .pm-btn.primary:hover{ background:#b2622d; }

  /* ── KALENDER VIEW (fuld skærm) ── */
  #view-calendar{ flex-direction:column; padding:clamp(16px,2vw,28px); }
  .cal-header{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px; flex:none; }
  .cal-nav-btn{ border:1px solid var(--border); background:var(--surface); border-radius:999px; width:36px; height:36px;
    font-size:16px; display:flex; align-items:center; justify-content:center; }
  .cal-nav-btn:hover{ background:var(--surface2); }
  .cal-title{ font-family:var(--font-heading); font-weight:900; font-size:clamp(18px,2vw,26px); min-width:200px; text-align:center; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-day-header{ font-size:clamp(10px,0.9vw,12px); font-weight:700; color:var(--text-muted); text-align:center; padding-bottom:6px;
    text-transform:uppercase; letter-spacing:0.05em; }
  .cal-body{ flex:1; min-height:0; grid-auto-rows:1fr; }
  .cal-day{ background:var(--surface); border-radius:var(--radius); padding:6px; overflow:hidden; display:flex; flex-direction:column; gap:3px; }
  .cal-day.other-month{ opacity:0.35; }
  .cal-day.today{ border:2px solid var(--accent); }
  .cal-day-num{ font-size:clamp(11px,1vw,14px); font-weight:700; color:var(--text-muted); flex:none; }
  .cal-task-chip{ font-size:clamp(9px,0.85vw,11px); font-weight:600; padding:2px 6px; border-radius:6px; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .cal-more{ font-size:9px; color:var(--text-muted); }

  /* ── KANBAN VIEW (fuld skærm) ── */
  #view-kanban{ padding:clamp(16px,2vw,28px); overflow:hidden; }
  .kanban-cols{ display:flex; gap:clamp(10px,1.4vw,18px); width:100%; height:100%; }
  .kanban-col{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--surface2); border-radius:var(--radius-lg); overflow:hidden; }
  .kanban-col-header{ display:flex; align-items:center; gap:8px; padding:clamp(10px,1.2vw,16px); font-size:clamp(12px,1.1vw,15px);
    font-weight:700; background:var(--surface); flex:none; }
  .kanban-count{ margin-left:auto; font-size:11px; background:rgba(0,0,0,0.1); padding:1px 9px; border-radius:999px; font-weight:700; }
  .kanban-col-body{ flex:1; min-height:0; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .kanban-card{ background:var(--surface); border-radius:var(--radius); padding:10px 12px; border-left:4px solid transparent; cursor:pointer; }
  .kanban-card.high{ border-left-color:var(--danger); background:var(--danger-light); }
  .kanban-card-title{ font-size:clamp(11px,1vw,13px); font-weight:600; line-height:1.3; }
  .kanban-card-date{ font-size:clamp(10px,0.9vw,11px); color:var(--text-muted); margin-top:4px; font-weight:600; }
  .kanban-card-date.late{ color:var(--danger); }
  .kanban-empty{ font-size:12px; color:var(--text-muted); text-align:center; padding:20px 0; }

  /* ── connect / settings (delt mønster med cover.html) ── */
  .connect{ width:100vw; height:100dvh; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; }
  .connect-box{ max-width:340px; text-align:center; display:flex; flex-direction:column; gap:12px; align-items:center; }
  .connect-box h2{ font-family:var(--font-heading); font-weight:900; margin:0; font-size:20px; }
  .connect-box p{ font-size:13px; color:var(--text-muted); margin:0; line-height:1.5; }
  .field{ width:100%; text-align:left; }
  .field label{ display:block; font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:4px; }
  .field input{ width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:999px; background:var(--surface2);
    font-size:13px; font-family:inherit; outline:none; }
  .field input:focus-visible{ border-color:var(--accent); }
  .btn{ border:none; border-radius:999px; padding:10px 22px; font-size:13px; font-weight:700; background:var(--accent); color:#fff; }
  .btn:hover{ background:#b2622d; }
  .corner-btns{ position:fixed; top:calc(10px + var(--safe-t)); right:calc(10px + var(--safe-r)); z-index:50; display:flex; gap:6px; }
  .settings-btn, .fs-btn{ position:relative; width:30px; height:30px; border-radius:999px; border:none;
    background:color-mix(in srgb, var(--sage-900) 55%, transparent); color:#fff; font-size:13px;
    display:flex; align-items:center; justify-content:center; opacity:.55; }
  .settings-btn:hover, .fs-btn:hover{ opacity:1; }
  .sb-dot{ width:6px; height:6px; border-radius:999px; background:var(--danger); position:absolute; top:2px; right:2px; }
  .sb-dot.ok{ background:var(--sage-500); }
  .overlay{ position:fixed; inset:0; background:color-mix(in srgb, var(--sage-900) 40%, transparent); z-index:60;
    display:flex; align-items:center; justify-content:center; }
  .modal{ background:var(--bg); border-radius:24px; padding:24px 26px; width:min(360px,88vw); display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow-lg); }
  .modal h3{ margin:0; font-family:var(--font-heading); font-weight:900; font-size:18px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .btn-secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-secondary:hover{ background:var(--surface2); }
  .toast{ position:fixed; bottom:calc(18px + var(--safe-b)); left:50%; transform:translateX(-50%);
    background:var(--sage-900); color:#fff; padding:9px 16px; border-radius:999px; font-size:12px; font-weight:600;
    z-index:200; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
</style>
</head>
<body>

<div class="corner-btns">
  <button class="fs-btn" id="fs-btn" onclick="toggleFullscreen()" title="Fuld skærm">⛶</button>
  <button class="settings-btn" id="settings-btn" onclick="openSettings()" title="Forbindelse">⚙<span class="sb-dot" id="sb-dot"></span></button>
</div>
<div id="root"></div>
<div class="toast" id="toast"></div>

<button class="pm-fab" id="pm-fab" onclick="onFabClick()" title="Pomodoro / Pomodoro+" style="display:none;">⚡</button>
<div class="pomodoro-overlay" id="pomodoro-overlay" onclick="if(event.target===this) closePomodoroPopup()">
  <div class="pomodoro-modal">
    <button class="pm-modal-close" onclick="closePomodoroPopup()">✕</button>
    <div class="pm-label" id="pm-label">Fokus</div>
    <div class="pm-focus-task" id="pm-focus-task">
      <div class="pm-ft-label">Fokusopgave</div>
      <div class="pm-ft-name" id="pm-ft-name"></div>
      <div class="pm-ft-proj" id="pm-ft-proj"></div>
      <div class="pm-ft-deadline" id="pm-ft-deadline"></div>
    </div>
    <div class="pm-display" id="pm-display">25:00</div>
    <div class="pm-pressure-wrap" id="pm-pressure-wrap"><div class="pm-pressure-bar" id="pm-pressure-bar"></div></div>
    <div class="pm-controls">
      <button class="pm-btn primary" id="pm-toggle-btn" onclick="toggleTimer()">▶ Start</button>
      <button class="pm-btn" onclick="resetTimer()">↺ Nulstil</button>
      <button class="pm-btn" onclick="stopPomodoro()">✕ Afslut</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov-settings" style="display:none" onclick="if(event.target===this) closeSettings()">
  <div class="modal">
    <h3>Forbindelse</h3>
    <p style="font-size:12.5px;color:var(--text-muted);margin:0;">Væg-skærmen bruger samme Supabase-database som desktop og mobil. Samme URL og nøgle virker her.</p>
    <div class="field"><label>Supabase URL</label><input type="text" id="set-url" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>Supabase anon key</label><input type="text" id="set-key" placeholder="eyJ..."></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeSettings()">Luk</button>
      <button class="btn" onclick="saveSettings()">Gem og forbind</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════ DATA MODEL (delt med desktop/mobil-Nooty) ══════════════════════════
const OPGAVE_TYPES = [
  { id:'vaeresteds',    navn:'Værestedsavisen', color:'#F0E175',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em;flex-shrink:0"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8"></path><path d="M15 18h-5"></path><path d="M10 6h8v4h-8V6Z"></path></svg>' },
  { id:'projekt',       navn:'Projekt',         color:'#a9c692',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em;flex-shrink:0"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path><path d="M8 10v4"></path><path d="M12 10v2"></path><path d="M16 10v6"></path></svg>' },
  { id:'aktivitet',     navn:'Aktivitet',       color:'#C5B7DC',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em;flex-shrink:0"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg>' },
  { id:'kommunikation', navn:'Kommunikation',   color:'#f69d6c',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em;flex-shrink:0"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"></path><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"></path></svg>' },
  { id:'andet',         navn:'Andet',           color:'#dbd4c4',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em;flex-shrink:0"><rect width="20" height="5" x="2" y="3" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path></svg>' },
];
function getOpgaveType(id){ return OPGAVE_TYPES.find(t=>t.id===id) || OPGAVE_TYPES[OPGAVE_TYPES.length-1]; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(d){ if(!d) return ''; const dt=new Date(d+'T12:00:00'); const M=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec']; return `${dt.getDate()}. ${M[dt.getMonth()]}`; }
function dateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getContrastText(hex){
  if(!hex || hex[0]!=='#' || hex.length<7) return '#201e1d';
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lum = (0.299*r+0.587*g+0.114*b)/255;
  return lum > 0.6 ? '#201e1d' : '#ffffff';
}

const PLATFORM_COLORS = { 'LinkedIn':{bg:'#0077b5'}, 'Facebook':{bg:'#1877f2'}, 'Instagram':{bg:'#c13584'} };
function platColor(p){ return PLATFORM_COLORS[p] || { bg:'#6c63ff' }; }

// ══════════════════════════ STATE ══════════════════════════
let state = { projects: [], some: [] };
let SUPABASE_URL = localStorage.getItem('fb_sb_url') || '';
let SUPABASE_KEY = localStorage.getItem('fb_sb_key') || '';
let sbReady = false;
let currentView = 'overview'; // 'overview' | 'calendar' | 'kanban'
let deckIndex = 0;
let calMonth = new Date().getMonth(), calYear = new Date().getFullYear();
let drag = 0, dragging = false, dragStartX = 0;

function sbHeaders(){ return { 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Prefer':'resolution=merge-duplicates' }; }
async function sbUpsert(row){ if(!sbReady) return; try{ await fetch(`${SUPABASE_URL}/rest/v1/projects`, { method:'POST', headers:sbHeaders(), body: JSON.stringify({ id: row.id, data: row }) }); }catch(e){ console.warn('Supabase write error:', e); } }
function parseRow(r){
  if(!r || r.data===undefined || r.data===null) return null;
  let obj = r.data;
  if(typeof obj === 'string'){ try{ obj = JSON.parse(obj); }catch(e){ return null; } }
  if(typeof obj !== 'object' || Array.isArray(obj)) return null;
  obj.id = r.id;
  if(!obj.title) return null;
  if(obj.done === undefined) obj.done = false;
  return obj;
}
function parseSomeRow(r){
  if(!r || r.data===undefined || r.data===null) return null;
  let obj = r.data;
  if(typeof obj === 'string'){ try{ obj = JSON.parse(obj); }catch(e){ return null; } }
  if(typeof obj !== 'object' || Array.isArray(obj)) return null;
  obj.id = r.id;
  return obj;
}
async function loadFromSupabase(){
  if(!sbReady) return;
  try{
    const [pr, sr] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/projects?select=*&limit=1000`, { headers:{...sbHeaders(),'Range':'0-999'} }),
      fetch(`${SUPABASE_URL}/rest/v1/some_posts?select=*&limit=1000`, { headers:{...sbHeaders(),'Range':'0-999'} }),
    ]);
    if(pr.ok){ const rows = await pr.json(); state.projects = rows.map(parseRow).filter(Boolean); }
    if(sr.ok){ const rows = await sr.json(); state.some = rows.map(parseSomeRow).filter(Boolean); }
    localStorage.setItem('nooty_wall_cache', JSON.stringify(state));
  }catch(e){ toast('Ingen forbindelse'); }
  renderCurrentView();
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2200); }

function toggleProjectDone(id){
  const p = state.projects.find(x=>x.id===id);
  if(!p) return;
  p.done = !p.done;
  p.doneAt = p.done ? new Date().toISOString() : null;
  sbUpsert(p);
  renderCurrentView();
}

// ══════════════════════════ SHELL / VIEW SWITCHING ══════════════════════════
function renderShell(){
  const root = document.getElementById('root');
  document.getElementById('settings-btn').style.display = sbReady ? 'flex' : 'none';
  document.getElementById('sb-dot').classList.toggle('ok', sbReady);
  document.getElementById('pm-fab').style.display = sbReady ? 'flex' : 'none';

  if(!sbReady){
    root.innerHTML = `<div class="connect"><div class="connect-box">
      <h2>Forbind Væg-skærmen</h2>
      <p>Indtast din Supabase-adresse og nøgle for at hente opgaverne — samme oplysninger som i mobil- og desktop-udgaven.</p>
      <button class="btn" onclick="openSettings()">Forbind nu</button>
    </div></div>`;
    return;
  }

  root.innerHTML = `
  <div id="app">
    <div class="wall-header">
      <div class="wall-logo"><span class="wl-badge">N</span><span class="wl-word">nooty</span></div>
      <div class="wall-tabs">
        <button class="wall-tab" onclick="switchView('overview')">Oversigt</button>
        <button class="wall-tab" onclick="switchView('calendar')">Kalender</button>
        <button class="wall-tab" onclick="switchView('kanban')">Kanban</button>
      </div>
      <div class="wall-clock" id="wall-clock"></div>
    </div>
    <div class="wall-content">
      <div class="wall-view" id="view-overview">
        <div class="wall-pills" id="wall-pills"></div>
        <div class="wall-deck">
          <div class="deck-head">
            <span class="deck-pos" id="deck-pos"></span>
            <div class="deck-dots" id="deck-dots"></div>
          </div>
          <div class="deck-swipe" id="deck-swipe">
            <div class="deck-card" id="deck-card"></div>
          </div>
        </div>
        <div class="wall-side">
          <div class="wall-some-cols">
            <div class="wall-panel-title">SoMe – kommende opslag</div>
            <div class="some-cols-row">
              <div class="some-col">
                <div class="some-col-title">Sport for Livet</div>
                <div id="some-list-sport"></div>
              </div>
              <div class="some-col">
                <div class="some-col-title">LVS</div>
                <div id="some-list-lvs"></div>
              </div>
            </div>
          </div>
          <div class="wall-inbox">
            <div class="wall-panel-title">Indbakke<span class="inbox-count-badge" id="inbox-count-badge" style="display:none;"></span></div>
            <div id="inbox-list-items"></div>
          </div>
        </div>
      </div>
      <div class="wall-view" id="view-calendar">
        <div class="cal-header">
          <button class="cal-nav-btn" onclick="calPrev()">←</button>
          <span class="cal-title" id="cal-title"></span>
          <button class="cal-nav-btn" onclick="calNext()">→</button>
        </div>
        <div class="cal-grid" id="cal-headers"></div>
        <div class="cal-grid cal-body" id="cal-body"></div>
      </div>
      <div class="wall-view" id="view-kanban">
        <div class="kanban-cols" id="kanban-cols"></div>
      </div>
    </div>
  </div>`;

  bindDeckDrag();
  updateWallClock();
  switchView(currentView);
}

function switchView(view){
  currentView = view;
  ['overview','calendar','kanban'].forEach(v=>{
    const el = document.getElementById('view-'+v);
    if(el) el.classList.toggle('active', v===view);
  });
  document.querySelectorAll('.wall-tab').forEach((b,i)=>{
    b.classList.toggle('active', ['overview','calendar','kanban'][i]===view);
  });
  renderCurrentView();
}
function renderCurrentView(){
  if(!sbReady) return;
  if(currentView==='overview') renderOverview();
  else if(currentView==='calendar') renderCalendarView();
  else if(currentView==='kanban') renderKanbanView();
}

// ══════════════════════════ OVERVIEW: PILL-LISTE (synkroniseret med deck) ══════════════════════════
function renderPillList(){
  const el = document.getElementById('wall-pills');
  if(!el) return;
  const items = deckItems();
  if(!items.length){ el.innerHTML = `<div class="wall-panel-title">Opgaver</div><div class="dl-empty">Ingen deadlines 🎉</div>`; return; }

  el.innerHTML = `<div class="wall-panel-title">Opgaver</div>` + items.map((p,i)=>{
    const type = getOpgaveType(p.type);
    const bg = p.color || type.color;
    const tc = getContrastText(bg);
    const active = i===deckIndex;
    return `<button class="pill-item ${active?'active':''}" style="background:${bg};color:${tc};" onclick="goToDeck(${i})">
      ${type.icon}
      <span class="pill-item-title">${esc(p.title)}</span>
      <span class="pill-item-date">${formatDate(p.deadline)}</span>
    </button>`;
  }).join('');

  const activeEl = el.querySelector('.pill-item.active');
  if(activeEl) activeEl.scrollIntoView({ block:'nearest' });
}

// ══════════════════════════ OVERVIEW: SWIPEABLE DECK (næste 10) ══════════════════════════
function deckItems(){
  return state.projects.filter(p=>!p.done && p.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,10);
}
function renderDeck(){
  const items = deckItems();
  const posEl = document.getElementById('deck-pos');
  const dotsEl = document.getElementById('deck-dots');
  const cardEl = document.getElementById('deck-card');
  if(!posEl || !cardEl) return;

  if(!items.length){
    posEl.textContent = '';
    dotsEl.innerHTML = '';
    cardEl.style.background = 'var(--surface)';
    cardEl.innerHTML = `<div class="deck-empty">Ingen kommende deadlines 🎉</div>`;
    return;
  }
  if(deckIndex >= items.length) deckIndex = items.length-1;
  if(deckIndex < 0) deckIndex = 0;

  posEl.textContent = `Opgave ${deckIndex+1} af ${items.length}`;
  dotsEl.innerHTML = items.map((_,i)=>`<button class="deck-dot ${i===deckIndex?'active':''}" onclick="goToDeck(${i})"></button>`).join('');

  const p = items[deckIndex];
  const type = getOpgaveType(p.type);
  const isHigh = p.prio === 'high';
  const overdue = p.deadline < dateStr(new Date());
  const parent = p.parentId ? state.projects.find(x=>x.id===p.parentId) : null;
  const children = state.projects.filter(c=>c.parentId===p.id);

  cardEl.style.background = type.color;
  cardEl.innerHTML = `
    <div class="deck-card-top">
      <span class="deck-chip">${type.icon} ${esc(p.underkat||type.navn)}</span>
      ${p.procestrin?`<span class="deck-chip">${esc(p.procestrin)}</span>`:''}
      ${isHigh?'<span class="deck-chip deck-chip-high">🔴 Høj</span>':''}
      <span class="deck-date ${overdue?'late':''}">${overdue?'⚠️ ':''}${formatDate(p.deadline)}</span>
    </div>
    <div class="deck-title">${esc(p.title)}</div>
    ${parent?`<div class="deck-parent">↳ ${esc(parent.title)}</div>`:''}
    ${p.desc?`<div class="deck-desc">${esc(p.desc)}</div>`:''}
    ${children.length?`<div class="deck-subtasks">
      <div class="deck-subtasks-title">Delopgaver (${children.filter(c=>c.done).length}/${children.length})</div>
      ${children.map(c=>`<div class="deck-subtask-row ${c.done?'done':''}"><span class="deck-subtask-dot ${c.done?'on':''}"></span>${esc(c.title)}</div>`).join('')}
    </div>`:''}
    <button class="deck-done-btn" onclick="event.stopPropagation();toggleProjectDone(${p.id})">✓ Markér færdig</button>
  `;
}
function goToDeck(i){ deckIndex=i; drag=0; updateDeckTransform(); renderDeck(); renderPillList(); }
function goDeck(delta){
  const items = deckItems();
  if(!items.length) return;
  deckIndex = (deckIndex+delta+items.length)%items.length;
  drag=0; updateDeckTransform(); renderDeck(); renderPillList();
}
function bindDeckDrag(){
  const swipe = document.getElementById('deck-swipe');
  if(!swipe) return;
  swipe.onpointerdown = (e)=>{ dragStartX=e.clientX; dragging=true; drag=0; updateDeckTransform(); };
  swipe.onpointermove = (e)=>{ if(!dragging) return; drag = e.clientX-dragStartX; updateDeckTransform(); };
  swipe.onpointerup = swipe.onpointercancel = ()=>{
    if(!dragging) return;
    dragging=false;
    if(drag < -60) goDeck(1);
    else if(drag > 60) goDeck(-1);
    else { drag=0; updateDeckTransform(); }
  };
}
function updateDeckTransform(){
  const card = document.getElementById('deck-card');
  if(!card) return;
  card.classList.toggle('dragging', dragging);
  const dragX = Math.max(-90,Math.min(90,drag));
  card.style.transform = `translateX(${dragX}px) rotate(${(drag*0.02).toFixed(2)}deg)`;
}

// ══════════════════════════ OVERVIEW: SOME (2 kolonner) ══════════════════════════
function renderSomeColumns(){
  const today = dateStr(new Date());
  const upcoming = (state.some||[]).filter(s=>!s.finishedAt && s.postDato && s.postDato>=today).sort((a,b)=>a.postDato.localeCompare(b.postDato));
  const renderCol = (org, elId) => {
    const el = document.getElementById(elId);
    if(!el) return;
    const items = upcoming.filter(s=>s.orgEnhed===org).slice(0,6);
    el.innerHTML = items.length ? items.map(s=>{
      const pc = platColor(s.platform);
      return `<div class="some-list-item">
        <span class="some-dot" style="background:${pc.bg};"></span>
        <div class="some-item-body">
          <div class="some-item-title">${esc(s.emne||(s.content?s.content.substring(0,24):'Opslag'))}</div>
          <div class="some-item-sub">${esc(s.platform||'')}</div>
        </div>
        <span class="some-item-date">${formatDate(s.postDato)}</span>
      </div>`;
    }).join('') : '<div class="dl-empty">Ingen</div>';
  };
  renderCol('sport', 'some-list-sport');
  renderCol('lvs', 'some-list-lvs');
}

// ══════════════════════════ OVERVIEW: INDBAKKE ══════════════════════════
function renderInboxList(){
  const el = document.getElementById('inbox-list-items');
  const badge = document.getElementById('inbox-count-badge');
  if(!el) return;
  const items = state.projects.filter(p=>!p.done && !p.parentId && !p.type);
  if(badge){
    if(items.length){ badge.textContent = items.length; badge.style.display = 'inline-block'; }
    else { badge.style.display = 'none'; }
  }
  if(!items.length){ el.innerHTML = '<div class="dl-empty">Indbakken er tom 🎉</div>'; return; }
  el.innerHTML = items.map(p=>`
    <div class="inbox-item">
      <span class="inbox-dot"></span>
      <span class="inbox-item-title">${esc(p.title)}</span>
    </div>`).join('');
}

function renderOverview(){
  renderPillList();
  renderDeck();
  renderSomeColumns();
  renderInboxList();
}

// ══════════════════════════ KALENDER-VIEW (fuld skærm) ══════════════════════════
function calPrev(){ if(calMonth===0){calMonth=11;calYear--;}else calMonth--; renderCalendarView(); }
function calNext(){ if(calMonth===11){calMonth=0;calYear++;}else calMonth++; renderCalendarView(); }
function renderCalendarView(){
  const y=calYear, m=calMonth;
  const MONTHS_DA=['Januar','Februar','Marts','April','Maj','Juni','Juli','August','September','Oktober','November','December'];
  const DAYS_DA=['Man','Tir','Ons','Tor','Fre','Lør','Søn'];
  const titleEl = document.getElementById('cal-title');
  if(!titleEl) return;
  titleEl.textContent = `${MONTHS_DA[m]} ${y}`;
  document.getElementById('cal-headers').innerHTML = DAYS_DA.map(d=>`<div class="cal-day-header">${d}</div>`).join('');

  const first=new Date(y,m,1); let startDow=first.getDay(); startDow=startDow===0?6:startDow-1;
  const daysInMonth=new Date(y,m+1,0).getDate(); const prevDays=new Date(y,m,0).getDate();
  const today=new Date(); let cells=[];
  for(let i=0;i<startDow;i++) cells.push({day:prevDays-startDow+1+i,other:true});
  for(let i=1;i<=daysInMonth;i++) cells.push({day:i,other:false});
  while(cells.length%7!==0) cells.push({day:cells.length-startDow-daysInMonth+1,other:true});

  document.getElementById('cal-body').innerHTML = cells.map(c=>{
    const ds = c.other ? '' : `${y}-${String(m+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;
    const isToday = !c.other && today.getFullYear()===y && today.getMonth()===m && today.getDate()===c.day;
    const tasks = c.other ? [] : state.projects.filter(p=>!p.done && p.deadline===ds);
    return `<div class="cal-day ${isToday?'today':''} ${c.other?'other-month':''}">
      <div class="cal-day-num">${c.day}</div>
      ${tasks.slice(0,4).map(p=>{
        const type = getOpgaveType(p.type);
        return `<div class="cal-task-chip" style="background:${type.color};" onclick="toggleProjectDone(${p.id})" title="${esc(p.title)}">${esc(p.title)}</div>`;
      }).join('')}
      ${tasks.length>4?`<div class="cal-more">+${tasks.length-4} mere</div>`:''}
    </div>`;
  }).join('');
}

// ══════════════════════════ KANBAN-VIEW (fuld skærm) ══════════════════════════
function renderKanbanView(){
  const el = document.getElementById('kanban-cols');
  if(!el) return;
  const today = dateStr(new Date());
  el.innerHTML = OPGAVE_TYPES.map(t=>{
    const tasks = state.projects.filter(p=>!p.done && !p.parentId && p.type===t.id)
      .sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));
    return `<div class="kanban-col">
      <div class="kanban-col-header" style="border-top:4px solid ${t.color};">${t.icon} ${t.navn} <span class="kanban-count">${tasks.length}</span></div>
      <div class="kanban-col-body">
        ${tasks.length===0?`<div class="kanban-empty">Ingen opgaver</div>`:tasks.map(p=>{
          const isHigh = p.prio==='high';
          const overdue = p.deadline && p.deadline < today;
          return `<div class="kanban-card ${isHigh?'high':''}" onclick="toggleProjectDone(${p.id})">
            <div class="kanban-card-title">${esc(p.title)}</div>
            ${p.deadline?`<div class="kanban-card-date ${overdue?'late':''}">${overdue?'⚠️ ':''}${formatDate(p.deadline)}</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════ UR ══════════════════════════
function updateWallClock(){
  const el = document.getElementById('wall-clock');
  if(!el) return;
  const now = new Date();
  const DAYS_DA=['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
  const MONTHS_DA=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  el.innerHTML = `<span class="wc-time">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</span><span class="wc-date">${DAYS_DA[now.getDay()]} ${now.getDate()}. ${MONTHS_DA[now.getMonth()]}</span>`;
}
setInterval(updateWallClock, 10000);

// ══════════════════════════ POMODORO (popup via FAB) ══════════════════════════
let timerSecs = 25*60, timerMode = 'focus', timerRunning = false, timerInterval = null;
let timerStartedAt = null, timerSecsAtStart = 0;
let pomodoroTask = null;
let pomodoroTotalSecs = 25*60;
let pomodoroStarted = false;

function onFabClick(){
  document.getElementById('pomodoro-overlay').classList.add('open');
  if(!pomodoroStarted) startPomodoroPlus();
}
function closePomodoroPopup(){
  document.getElementById('pomodoro-overlay').classList.remove('open');
}
function stopPomodoro(){
  clearInterval(timerInterval); timerRunning=false; pomodoroTask=null; pomodoroStarted=false;
  timerSecs = 25*60; pomodoroTotalSecs = 25*60; timerMode='focus';
  document.getElementById('pm-focus-task').style.display='none';
  document.getElementById('pm-pressure-wrap').style.display='none';
  document.getElementById('pm-label').textContent='Fokus';
  document.getElementById('pm-display').textContent='25:00';
  document.getElementById('pm-toggle-btn').textContent='▶ Start';
  closePomodoroPopup();
}
function startPomodoroPlus(){
  pomodoroStarted = true;
  let best = null, bestDate = null;
  state.projects.filter(p=>!p.done&&p.deadline).forEach(p=>{
    const d = new Date(p.deadline+'T23:59:59');
    if(!bestDate || d < bestDate){
      bestDate = d;
      const parent = p.parentId ? state.projects.find(x=>x.id===p.parentId) : null;
      best = { name:p.title, proj: parent?parent.title:'Opgavedeadline', deadline:p.deadline, color:p.color||'#7A8088', projId:p.id };
    }
  });

  if(!best){
    toast('Ingen åbne opgaver med deadline fundet');
    startPomodoro();
    return;
  }

  pomodoroTask = best;
  const daysLeft = Math.ceil((new Date(best.deadline+'T23:59:59') - new Date()) / 86400000);
  let mins = daysLeft <= 0 ? 15 : daysLeft === 1 ? 20 : 25;
  timerSecs = mins*60; pomodoroTotalSecs = mins*60;
  timerMode = 'focus'; timerRunning = false;

  document.getElementById('pm-label').textContent = `⚡ Pomodoro+ · ${mins} min`;
  document.getElementById('pm-focus-task').style.display = 'block';
  document.getElementById('pm-ft-name').textContent = best.name;
  document.getElementById('pm-ft-proj').textContent = best.proj;

  const dlEl = document.getElementById('pm-ft-deadline');
  if(daysLeft <= 0){ dlEl.textContent = '🔴 Deadline OVERSKREDET'; dlEl.style.color = 'var(--danger)'; }
  else if(daysLeft === 1){ dlEl.textContent = '🟠 Deadline I MORGEN'; dlEl.style.color = 'var(--warning)'; }
  else { dlEl.textContent = `🟡 Deadline om ${daysLeft} dage`; dlEl.style.color = 'var(--sidebar-text)'; }

  document.getElementById('pm-pressure-wrap').style.display = 'block';
  document.getElementById('pm-pressure-bar').style.width = '100%';
  document.getElementById('pm-pressure-bar').style.background = daysLeft<=0?'var(--danger)':daysLeft===1?'var(--warning)':'var(--accent2)';

  document.getElementById('pm-toggle-btn').textContent = '▶ Start';
  updateTimerDisplay();
  toast(`⚡ Pomodoro+ – fokus på: ${best.name}`);
}
function startPomodoro(){
  pomodoroStarted = true;
  pomodoroTask = null;
  document.getElementById('pm-focus-task').style.display = 'none';
  document.getElementById('pm-pressure-wrap').style.display = 'none';
  document.getElementById('pm-label').textContent = 'Fokus';
  timerSecs = 25*60; pomodoroTotalSecs = 25*60; timerMode = 'focus'; timerRunning = false;
  document.getElementById('pm-toggle-btn').textContent = '▶ Start';
  updateTimerDisplay();
}
function updatePressureBar(){
  if(!pomodoroTask) return;
  const pct = timerSecs / pomodoroTotalSecs * 100;
  const bar = document.getElementById('pm-pressure-bar');
  bar.style.width = pct + '%';
  if(pct > 50) bar.style.background = 'var(--accent2)';
  else if(pct > 25) bar.style.background = 'var(--warning)';
  else bar.style.background = 'var(--danger)';
}
function toggleTimer(){
  timerRunning = !timerRunning;
  document.getElementById('pm-toggle-btn').textContent = timerRunning ? '⏸ Pause' : '▶ Start';
  if(timerRunning){
    requestNotificationPermission();
    timerStartedAt = Date.now(); timerSecsAtStart = timerSecs;
    clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
      const elapsed = Math.floor((Date.now()-timerStartedAt)/1000);
      timerSecs = Math.max(0, timerSecsAtStart - elapsed);
      updateTimerDisplay();
      if(pomodoroTask) updatePressureBar();
      if(timerSecs<=0){
        clearInterval(timerInterval); timerRunning=false; timerStartedAt=null;
        if(timerMode==='focus'){
          if(pomodoroTask){
            sendNotification('⚡ Fokus-session færdig!', `Tid til at markere "${pomodoroTask.name}" som færdig?`);
            toast(`⚡ Session færdig! Markér "${pomodoroTask.name}" som færdig?`);
            if(pomodoroTask.projId && confirm(`Markér "${pomodoroTask.name}" som færdig?`)) toggleProjectDone(pomodoroTask.projId);
          } else {
            sendNotification('⏱ Fokus-session færdig!', 'Tag en velfortjent pause 🎉');
            toast('⏱ Fokus-session færdig! Tag en pause 🎉');
          }
          timerMode='break'; timerSecs=5*60; pomodoroTotalSecs=5*60;
          document.getElementById('pm-label').textContent='Pause';
          document.getElementById('pm-pressure-wrap').style.display='none';
        } else {
          sendNotification('☕ Pause slut!', 'Klar til en ny fokus-session? 💪');
          toast('Pause slut – klar? 💪');
          timerMode='focus'; timerSecs=25*60; pomodoroTotalSecs=25*60;
          document.getElementById('pm-label').textContent='Fokus';
        }
        document.getElementById('pm-toggle-btn').textContent='▶ Start';
        updateTimerDisplay();
      }
    }, 500);
  } else {
    clearInterval(timerInterval); timerStartedAt=null;
  }
}
function resetTimer(){
  clearInterval(timerInterval); timerRunning=false;
  timerSecs = pomodoroTotalSecs||25*60; timerMode='focus';
  document.getElementById('pm-label').textContent = pomodoroTask?'⚡ Pomodoro+':'Fokus';
  document.getElementById('pm-toggle-btn').textContent='▶ Start';
  if(pomodoroTask) document.getElementById('pm-pressure-bar').style.width='100%';
  updateTimerDisplay();
}
function updateTimerDisplay(){
  const m=Math.floor(timerSecs/60), s=timerSecs%60;
  document.getElementById('pm-display').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && timerRunning && timerStartedAt){
    const elapsed = Math.floor((Date.now()-timerStartedAt)/1000);
    timerSecs = Math.max(0, timerSecsAtStart - elapsed);
    updateTimerDisplay();
    if(pomodoroTask) updatePressureBar();
  }
});

// ══════════════════════════ NOTIFIKATIONER ══════════════════════════
function requestNotificationPermission(){ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }
function sendNotification(title, body){ if('Notification' in window && Notification.permission==='granted') new Notification(title, { body }); }

// ══════════════════════════ SETTINGS ══════════════════════════
function openSettings(){
  document.getElementById('set-url').value = SUPABASE_URL;
  document.getElementById('set-key').value = SUPABASE_KEY;
  document.getElementById('ov-settings').style.display = 'flex';
}
function closeSettings(){ document.getElementById('ov-settings').style.display = 'none'; }
function saveSettings(){
  const url = document.getElementById('set-url').value.trim().replace(/\/$/,'');
  const key = document.getElementById('set-key').value.trim();
  if(!url || !key){ toast('Udfyld begge felter'); return; }
  SUPABASE_URL = url; SUPABASE_KEY = key;
  localStorage.setItem('fb_sb_url', url);
  localStorage.setItem('fb_sb_key', key);
  sbReady = true;
  closeSettings();
  toast('Forbundet – henter data...');
  renderShell();
  loadFromSupabase();
}

// ══════════════════════════ FULD SKÆRM ══════════════════════════
function toggleFullscreen(){
  document.documentElement.requestFullscreen().then(()=>{
    if(screen.orientation && screen.orientation.lock){ screen.orientation.lock('landscape').catch(()=>{}); }
  }).catch(()=>toast('Kunne ikke gå i fuld skærm her'));
}
function syncFullscreenBtn(){
  const btn = document.getElementById('fs-btn');
  if(btn) btn.style.display = document.fullscreenElement ? 'none' : 'flex';
}
document.addEventListener('fullscreenchange', syncFullscreenBtn);

(function installManifest(){
  const manifest = {
    name: 'Nooty – Væg', short_name: 'Nooty Væg',
    display: 'fullscreen', display_override: ['fullscreen', 'standalone'],
    orientation: 'landscape', start_url: '.', scope: '.',
    background_color: '#272e1b', theme_color: '#3d472b'
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

// ══════════════════════════ HOLD SKÆRMEN TÆNDT ══════════════════════════
let wakeLock = null;
async function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{ wakeLock = await navigator.wakeLock.request('screen'); }
  catch(e){ console.warn('Wake Lock fejlede:', e); }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){ requestWakeLock(); loadFromSupabase(); }
});

// ══════════════════════════ AUTO-OPDATERING ══════════════════════════
const REFRESH_MS = 60000;
setInterval(()=>{ if(sbReady) loadFromSupabase(); }, REFRESH_MS);

// ══════════════════════════ INIT ══════════════════════════
(function init(){
  const cached = localStorage.getItem('nooty_wall_cache');
  if(cached){ try{ state = JSON.parse(cached); if(!state.some) state.some=[]; }catch(e){} }
  if(SUPABASE_URL && SUPABASE_KEY){ sbReady = true; renderShell(); loadFromSupabase(); }
  else { renderShell(); }
  syncFullscreenBtn();
  requestWakeLock();
})();
</script>
