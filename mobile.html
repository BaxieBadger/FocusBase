<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B8BB0">
<title>Nooty – Mobil</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#f0f1f4; --border:#e2e4e9;
    --text:#1f2134; --text-muted:#676879; --text-dim:#9099a8;
    --accent:#6c63ff; --accent-light:#ede9ff;
    --danger:#e44258; --warning:#f5a623; --ok:#00c875;
    --radius:12px; --radius-lg:18px;
    --font:'Inter',system-ui,sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  body{padding-bottom:calc(84px + var(--safe-bottom));}
  a{color:inherit;}
  button{font-family:var(--font);}
  input,select,textarea{font-family:var(--font);}

  /* ── TOPBAR ── */
  .topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;}
  .topbar h1{font-size:19px;font-weight:800;margin:0;flex:1;letter-spacing:-0.3px;}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--surface2);color:var(--text-muted);
    font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .sb-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);position:absolute;margin-left:26px;margin-top:-4px;border:2px solid var(--surface);}
  .sb-dot.ok{background:var(--ok);}

  /* ── STATUS STRIP ── */
  .status-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 6px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 10px;text-align:center;}
  .stat-card .v{font-size:22px;font-weight:800;line-height:1;}
  .stat-card .l{font-size:10px;color:var(--text-muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}
  .stat-card.warn .v{color:var(--warning);}
  .stat-card.danger .v{color:var(--danger);}

  .inbox-banner{margin:10px 16px 0;padding:10px 12px;background:var(--accent-light);border-radius:var(--radius);
    font-size:12px;color:var(--accent);display:flex;align-items:center;gap:8px;}

  /* ── FILTER CHIPS ── */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);
    font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;white-space:nowrap;}
  .chip.active{border-color:transparent;color:#fff;}

  /* ── LIST ── */
  .list{padding:8px 16px 20px;display:flex;flex-direction:column;gap:8px;}
  .empty{text-align:center;padding:50px 20px;color:var(--text-dim);}
  .empty .e{font-size:34px;margin-bottom:8px;}
  .empty .t{font-size:13px;}

  .card{background:var(--surface);border-radius:var(--radius-lg);padding:13px 14px;display:flex;align-items:flex-start;gap:11px;
    box-shadow:0 1px 2px rgba(20,20,40,0.04); cursor:pointer;}
  .card.done{opacity:0.55;}
  .check{width:23px;height:23px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;}
  .check.on{border-color:transparent;}
  .card-body{flex:1;min-width:0;}
  .card-title{font-size:14.5px;font-weight:600;line-height:1.35;}
  .card.done .card-title{text-decoration:line-through;color:var(--text-dim);}
  .card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center;}
  .pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap;}
  .pill-type{background:var(--surface2);color:var(--text-muted);}
  .pill-proc{background:rgba(0,0,0,0.06);color:var(--text-muted);font-style:italic;font-weight:500;}
  .pill-dl{background:var(--surface2);color:var(--text-muted);}
  .pill-dl.soon{background:#fff4e0;color:#9a6400;}
  .pill-dl.late{background:#fdeaec;color:var(--danger);}
  .pill-kids{background:var(--surface2);color:var(--text-dim);}

  /* ── FAB ── */
  .fab{position:fixed;right:18px;bottom:calc(22px + var(--safe-bottom));width:58px;height:58px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:0 6px 18px rgba(108,99,255,0.45);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:30;}

  /* ── SHEET (bottom sheet modal) ── */
  .sheet-overlay{position:fixed;inset:0;background:rgba(15,15,25,0.45);z-index:100;display:none;}
  .sheet-overlay.open{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--surface);
    border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(100%);
    transition:transform 0.28s cubic-bezier(.32,.72,0,1);padding-bottom:calc(24px + var(--safe-bottom));}
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 4px;}
  .sheet-header{display:flex;align-items:center;gap:10px;padding:8px 18px 12px;position:sticky;top:0;background:var(--surface);z-index:2;}
  .sheet-title{font-size:17px;font-weight:800;flex:1;}
  .sheet-close{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:none;color:var(--text-muted);font-size:15px;cursor:pointer;}
  .sheet-body{padding:0 18px 8px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;}
  .field input[type=text],.field input[type=date],.field select,.field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);
    font-size:15px;color:var(--text);outline:none;}
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .prio-row{display:flex;gap:8px;}
  .prio-btn{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);
    font-size:12.5px;font-weight:600;color:var(--text-muted);text-align:center;cursor:pointer;}
  .prio-btn.active{border-color:transparent;color:#fff;}

  .btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
  .btn.secondary{background:var(--surface2);color:var(--text);}
  .btn.danger{background:#fdeaec;color:var(--danger);}
  .btn.sm{width:auto;padding:8px 14px;font-size:13px;}

  /* ── DETAIL SHEET ── */
  .detail-hero{padding:2px 18px 14px;}
  .detail-title{font-size:20px;font-weight:800;line-height:1.3;margin-bottom:8px;word-break:break-word;}
  .detail-pills{display:flex;flex-wrap:wrap;gap:6px;}

  .section{margin:18px 0;}
  .section-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .section-label .add-link{margin-left:auto;font-size:12px;color:var(--accent);font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0;}

  .note-item{padding:9px 0;border-top:1px solid var(--border);}
  .note-item:first-child{border-top:none;}
  .note-ts{font-size:10.5px;color:var(--text-dim);font-style:italic;}
  .note-text{font-size:13.5px;margin-top:2px;line-height:1.4;}
  .note-add{display:flex;gap:8px;margin-top:8px;}
  .note-add input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);font-size:14px;outline:none;}
  .note-add button{padding:0 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}

  .kid-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--border);}
  .kid-row:first-child{border-top:none;}
  .kid-check{width:19px;height:19px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;}
  .kid-title{flex:1;font-size:13.5px;}
  .kid-row.done .kid-title{text-decoration:line-through;color:var(--text-dim);}
  .kid-dl{font-size:10.5px;color:var(--text-dim);white-space:nowrap;}
  .kid-del{background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;padding:2px 4px;}

  .connect-screen{padding:60px 24px;text-align:center;}
  .connect-screen .e{font-size:44px;margin-bottom:14px;}
  .connect-screen h2{font-size:18px;margin-bottom:8px;}
  .connect-screen p{font-size:13.5px;color:var(--text-muted);line-height:1.5;margin-bottom:20px;}

  .toast{position:fixed;bottom:calc(96px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    background:#1f2134;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;
    z-index:200;opacity:0;pointer-events:none;transition:opacity 0.25s, transform 0.25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<div class="topbar">
  <h1>📋 Nooty</h1>
  <button class="icon-btn" id="refresh-btn" onclick="manualRefresh()" title="Opdater">⟳</button>
  <button class="icon-btn" onclick="openSettings()" title="Indstillinger">⚙️<span class="sb-dot" id="sb-dot"></span></button>
</div>

<div id="app"></div>

<button class="fab" onclick="openCreate(null)">+</button>

<!-- SETTINGS SHEET -->
<div class="sheet-overlay" id="ov-settings" onclick="if(event.target===this)closeSheet('ov-settings')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><div class="sheet-title">Forbindelse</div>
      <button class="sheet-close" onclick="closeSheet('ov-settings')">✕</button></div>
    <div class="sheet-body">
      <p style="font-size:12.5px;color:var(--text-muted);margin-top:0;">Nooty Mobil bruger samme Supabase-database som desktop-udgaven. Indsæt de samme oplysninger her.</p>
      <div class="field"><label>Supabase URL</label><input type="text" id="set-url" placeholder="https://xxxx.supabase.co"></div>
      <div class="field"><label>Supabase anon key</label><input type="text" id="set-key" placeholder="eyJ..."></div>
      <button class="btn" onclick="saveSettings()">Gem og forbind</button>
    </div>
  </div>
</div>

<!-- CREATE/EDIT SHEET -->
<div class="sheet-overlay" id="ov-edit" onclick="if(event.target===this)closeSheet('ov-edit')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><div class="sheet-title" id="edit-title">Ny opgave</div>
      <button class="sheet-close" onclick="closeSheet('ov-edit')">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>Titel</label><input type="text" id="ed-title" placeholder="Hvad skal der ske?"></div>
      <div class="row2">
        <div class="field"><label>Opgave-type</label><select id="ed-type" onchange="editUpdateUnderkat()"></select></div>
        <div class="field"><label>Underkategori</label><select id="ed-underkat"></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Deadline</label><input type="date" id="ed-deadline"></div>
        <div class="field"><label>Procestrin</label><input type="text" id="ed-procestrin" placeholder="fx Skrives"></div>
      </div>
      <div class="field"><label>Prioritet</label>
        <div class="prio-row">
          <div class="prio-btn" data-p="low" onclick="setPrio('low')">Lav</div>
          <div class="prio-btn" data-p="mid" onclick="setPrio('mid')">Middel</div>
          <div class="prio-btn" data-p="high" onclick="setPrio('high')">Høj</div>
        </div>
      </div>
      <button class="btn" onclick="saveEdit()">Gem</button>
      <button class="btn danger" id="ed-delete-btn" onclick="deleteFromEdit()" style="display:none;">Slet opgave</button>
    </div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="sheet-overlay" id="ov-detail" onclick="if(event.target===this)closeSheet('ov-detail')">
  <div class="sheet" style="max-height:92vh;">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" style="font-size:14px;color:var(--text-muted);font-weight:700;">Opgave</div>
      <button class="icon-btn" style="width:32px;height:32px;font-size:13px;" onclick="editFromDetail()">✎</button>
      <button class="sheet-close" onclick="closeSheet('ov-detail')">✕</button>
    </div>
    <div class="detail-hero">
      <div class="detail-title" id="dt-title"></div>
      <div class="detail-pills" id="dt-pills"></div>
    </div>
    <div class="sheet-body">
      <div class="section" id="dt-kids-section">
        <div class="section-label">Delopgaver <span class="add-link" onclick="openCreate(_detailId)">+ Tilføj</span></div>
        <div id="dt-kids"></div>
      </div>
      <div class="section">
        <div class="section-label">Noter</div>
        <div id="dt-notes"></div>
        <div class="note-add">
          <input type="text" id="dt-note-input" placeholder="Skriv en note...">
          <button onclick="addNoteToDetail()">Gem</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════ DATA MODEL (delt med desktop-Nooty) ══════════════════════════
const OPGAVE_TYPES = [
  { id:'vaeresteds',    navn:'Værestedsavisen', emoji:'📰', color:'#265E3A', underkategorier:['Artikel','Administrativt','Andet'] },
  { id:'projekt',       navn:'Projekt',         emoji:'🧩', color:'#1B8BB0', underkategorier:['Craft','Sundhed','Natur','Det Digitale Værested','Andet'] },
  { id:'aktivitet',     navn:'Aktivitet',       emoji:'🎪', color:'#C15A1A', underkategorier:['Sport for Livet','Ferie Camp','Royal Side Run','Landsmøde','Den Nationale Værestedsdag','Temadage','Andet'] },
  { id:'kommunikation', navn:'Kommunikation',   emoji:'📢', color:'#C9A800', underkategorier:['Website','Nyhedsbrev','Presse','Intern','SoMe'] },
  { id:'andet',         navn:'Andet',           emoji:'🗂', color:'#7A8088', underkategorier:['Andet'] },
];
function getOpgaveType(id){ return OPGAVE_TYPES.find(t=>t.id===id) || OPGAVE_TYPES[OPGAVE_TYPES.length-1]; }
function getUnderkategorier(id){ return getOpgaveType(id).underkategorier; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(d){ if(!d) return ''; const dt=new Date(d+'T12:00:00'); const M=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec']; return `${dt.getDate()}. ${M[dt.getMonth()]}`; }

// ══════════════════════════ STATE ══════════════════════════
let state = { projects: [], nextId: 1 };
let SUPABASE_URL = localStorage.getItem('fb_sb_url') || '';
let SUPABASE_KEY = localStorage.getItem('fb_sb_key') || '';
let sbReady = false;
let activeFilter = 'open';   // 'open' | 'all' | type id
let editingId = null, editingParentId = null;
let _detailId = null;

function sbHeaders(){
  return { 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Prefer':'resolution=merge-duplicates' };
}
async function sbUpsert(row){
  if(!sbReady) return;
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/projects`, { method:'POST', headers:sbHeaders(), body: JSON.stringify({ id: row.id, data: row }) });
  }catch(e){ console.warn('Supabase write error:', e); }
}
async function sbDelete(id){
  if(!sbReady) return;
  try{ await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${id}`, { method:'DELETE', headers:sbHeaders() }); }catch(e){}
}
function parseRow(r){
  if(!r || r.data===undefined || r.data===null) return null;
  let obj = r.data;
  if(typeof obj === 'string'){
    try{ obj = JSON.parse(obj); }catch(e){ return null; }
  }
  if(typeof obj !== 'object' || Array.isArray(obj)) return null;
  obj.id = r.id;
  if(!obj.title) return null;
  if(!obj.prio) obj.prio = 'mid';
  if(obj.done === undefined) obj.done = false;
  return obj;
}
async function loadFromSupabase(showToast){
  if(!sbReady) return;
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/projects?select=*&limit=1000`, { headers:{...sbHeaders(),'Range':'0-999'} });
    if(r.ok){
      const rows = await r.json();
      const parsed = rows.map(parseRow).filter(Boolean);
      state.projects = parsed;
      state.nextId = Math.max(1, ...parsed.map(p=>Number(p.id)||0)) + 1;
      localStorage.setItem('nooty_mobile_cache', JSON.stringify(state));
      if(showToast) toast('Opdateret ✓');
    } else {
      toast('Kunne ikke hente data');
    }
  }catch(e){ toast('Ingen forbindelse'); }
  btn.classList.remove('spinning');
  renderApp();
}
function manualRefresh(){ loadFromSupabase(true); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ══════════════════════════ INIT ══════════════════════════
async function init(){
  const cached = localStorage.getItem('nooty_mobile_cache');
  if(cached){ try{ state = JSON.parse(cached); }catch(e){} }
  if(SUPABASE_URL && SUPABASE_KEY){
    sbReady = true;
    document.getElementById('sb-dot').classList.add('ok');
    renderApp();
    loadFromSupabase(false);
  } else {
    renderApp();
  }
}

// ══════════════════════════ RENDER ══════════════════════════
function children(id){ return state.projects.filter(c=>c.parentId===id); }
function topLevel(){ return state.projects.filter(p=>!p.parentId && p.type); }
function untriaged(){ return state.projects.filter(p=>!p.type && !p.parentId); }

function renderApp(){
  const app = document.getElementById('app');
  if(!sbReady){
    app.innerHTML = `<div class="connect-screen">
      <div class="e">☁️</div>
      <h2>Forbind til Nooty</h2>
      <p>Indtast din Supabase-adresse og nøgle for at hente dine opgaver – samme oplysninger som i desktop-udgaven.</p>
      <button class="btn" onclick="openSettings()">Forbind nu</button>
    </div>`;
    return;
  }

  const all = topLevel();
  const today = new Date().toISOString().split('T')[0];
  const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate()+7);
  const weekEndStr = weekEnd.toISOString().split('T')[0];
  const open = all.filter(p=>!p.done);
  const overdue = open.filter(p=>p.deadline && p.deadline < today);
  const soon = open.filter(p=>p.deadline && p.deadline >= today && p.deadline <= weekEndStr);
  const inbox = untriaged();

  let filtered;
  if(activeFilter === 'open') filtered = open;
  else if(activeFilter === 'all') filtered = all;
  else filtered = all.filter(p=>p.type===activeFilter);

  filtered = [...filtered].sort((a,b)=>{
    if(a.done !== b.done) return a.done ? 1 : -1;
    if(!a.deadline && !b.deadline) return 0;
    if(!a.deadline) return 1;
    if(!b.deadline) return -1;
    return a.deadline.localeCompare(b.deadline);
  });

  const chips = [
    {id:'open', label:'Åbne', color:'#6c63ff'},
    {id:'all', label:'Alle', color:'#6c63ff'},
    ...OPGAVE_TYPES.map(t=>({id:t.id, label:t.emoji+' '+t.navn, color:t.color})),
  ];

  app.innerHTML = `
    <div class="status-strip">
      <div class="stat-card"><div class="v">${open.length}</div><div class="l">Åbne</div></div>
      <div class="stat-card warn"><div class="v">${soon.length}</div><div class="l">Snart</div></div>
      <div class="stat-card danger"><div class="v">${overdue.length}</div><div class="l">Overskredet</div></div>
    </div>
    ${inbox.length ? `<div class="inbox-banner">📥 ${inbox.length} indkomne opgave${inbox.length!==1?'r':''} venter på planlægning på desktop</div>` : ''}
    <div class="chip-row">
      ${chips.map(c=>`<div class="chip ${activeFilter===c.id?'active':''}" style="${activeFilter===c.id?`background:${c.color};border-color:${c.color};`:''}" onclick="setFilter('${c.id}')">${c.label}</div>`).join('')}
    </div>
    <div class="list">
      ${!filtered.length ? `<div class="empty"><div class="e">🎉</div><div class="t">Ingen opgaver her</div></div>` :
        filtered.map(p=>renderCard(p)).join('')}
    </div>
  `;
}

function renderCard(p){
  const type = getOpgaveType(p.type);
  const kids = children(p.id);
  const today = new Date().toISOString().split('T')[0];
  let dlClass = '';
  if(p.deadline){ dlClass = p.deadline < today ? 'late' : (p.deadline <= new Date(Date.now()+3*86400000).toISOString().split('T')[0] ? 'soon' : ''); }
  return `<div class="card ${p.done?'done':''}" onclick="openDetail(${p.id})">
    <div class="check ${p.done?'on':''}" style="${p.done?`background:${type.color};`:''}" onclick="event.stopPropagation();toggleDone(${p.id})">${p.done?'✓':''}</div>
    <div class="card-body">
      <div class="card-title">${esc(p.title)}</div>
      <div class="card-meta">
        <span class="pill pill-type" style="background:${type.color}22;color:${type.color};">${type.emoji} ${esc(p.underkat||type.navn)}</span>
        ${p.procestrin ? `<span class="pill pill-proc">${esc(p.procestrin)}</span>` : ''}
        ${p.deadline ? `<span class="pill pill-dl ${dlClass}">⏰ ${formatDate(p.deadline)}</span>` : ''}
        ${kids.length ? `<span class="pill pill-kids">${kids.filter(k=>k.done).length}/${kids.length} delopgaver</span>` : ''}
      </div>
    </div>
  </div>`;
}

function setFilter(id){ activeFilter = id; renderApp(); }

// ══════════════════════════ ACTIONS ══════════════════════════
function toggleDone(id){
  const p = state.projects.find(x=>x.id===id);
  if(!p) return;
  p.done = !p.done;
  p.doneAt = p.done ? new Date().toISOString() : null;
  persist(p);
  renderApp();
  if(_detailId===id) openDetail(id);
}

function persist(p){
  localStorage.setItem('nooty_mobile_cache', JSON.stringify(state));
  sbUpsert(p);
}

// ── Create / edit sheet ──
function openCreate(parentId){
  editingId = null; editingParentId = parentId;
  document.getElementById('edit-title').textContent = parentId ? 'Ny delopgave' : 'Ny opgave';
  document.getElementById('ed-title').value = '';
  populateEditTypeSelect();
  document.getElementById('ed-type').value = parentId ? (state.projects.find(x=>x.id===parentId)?.type||'andet') : 'andet';
  editUpdateUnderkat();
  document.getElementById('ed-deadline').value = '';
  document.getElementById('ed-procestrin').value = '';
  setPrio('mid');
  document.getElementById('ed-delete-btn').style.display = 'none';
  openSheet('ov-edit');
  setTimeout(()=>document.getElementById('ed-title').focus(), 300);
}
function editFromDetail(){
  const id = _detailId;
  closeSheet('ov-detail');
  setTimeout(()=>openEdit(id), 200);
}
function openEdit(id){
  const p = state.projects.find(x=>x.id===id);
  if(!p) return;
  editingId = id; editingParentId = p.parentId||null;
  document.getElementById('edit-title').textContent = 'Rediger opgave';
  document.getElementById('ed-title').value = p.title||'';
  populateEditTypeSelect();
  document.getElementById('ed-type').value = p.type||'andet';
  editUpdateUnderkat(p.underkat);
  document.getElementById('ed-deadline').value = p.deadline||'';
  document.getElementById('ed-procestrin').value = p.procestrin||'';
  setPrio(p.prio||'mid');
  document.getElementById('ed-delete-btn').style.display = 'block';
  openSheet('ov-edit');
}
function populateEditTypeSelect(){
  document.getElementById('ed-type').innerHTML = OPGAVE_TYPES.map(t=>`<option value="${t.id}">${t.emoji} ${t.navn}</option>`).join('');
}
function editUpdateUnderkat(selected){
  const typeId = document.getElementById('ed-type').value;
  const opts = getUnderkategorier(typeId);
  document.getElementById('ed-underkat').innerHTML = opts.map(u=>`<option value="${u}" ${u===selected?'selected':''}>${u}</option>`).join('');
}
function setPrio(p){
  document.querySelectorAll('.prio-btn').forEach(b=>{
    const on = b.dataset.p===p;
    b.classList.toggle('active', on);
    const type = getOpgaveType(document.getElementById('ed-type')?.value);
    b.style.background = on ? (p==='high'?'#e44258':p==='mid'?'#6c63ff':'#9099a8') : '';
  });
  window._editPrio = p;
}
function saveEdit(){
  const title = document.getElementById('ed-title').value.trim();
  if(!title){ toast('Skriv en titel først'); return; }
  const typeId = document.getElementById('ed-type').value;
  const underkat = document.getElementById('ed-underkat').value;
  const deadline = document.getElementById('ed-deadline').value;
  const procestrin = document.getElementById('ed-procestrin').value.trim();
  const prio = window._editPrio || 'mid';
  const color = getOpgaveType(typeId).color;

  if(editingId){
    const p = state.projects.find(x=>x.id===editingId);
    if(!p) return;
    Object.assign(p, { title, type:typeId, underkat, deadline, procestrin, prio, color });
    persist(p);
    toast('Gemt ✓');
  } else {
    const p = {
      id: state.nextId++, title, type:typeId, underkat, parentId: editingParentId||null,
      deadline, deadlineFinal:'', procestrin, prio, color, done:false,
      notes:'', interviews:[], createdAt: new Date().toISOString(),
    };
    state.projects.push(p);
    persist(p);
    toast('Opgave oprettet ✓');
  }
  closeSheet('ov-edit');
  renderApp();
  if(_detailId) openDetail(_detailId);
}
function deleteFromEdit(){
  if(!editingId) return;
  const kids = children(editingId);
  if(!confirm(kids.length ? `Slet opgave og ${kids.length} delopgave(r)?` : 'Slet denne opgave?')) return;
  const ids = [editingId, ...kids.map(k=>k.id)];
  state.projects = state.projects.filter(x=>!ids.includes(x.id));
  localStorage.setItem('nooty_mobile_cache', JSON.stringify(state));
  ids.forEach(sbDelete);
  closeSheet('ov-edit');
  closeSheet('ov-detail');
  renderApp();
  toast('Slettet');
}

// ── Detail sheet ──
function openDetail(id){
  const p = state.projects.find(x=>x.id===id);
  if(!p) return;
  _detailId = id;
  const type = getOpgaveType(p.type);
  document.getElementById('dt-title').textContent = p.title;
  document.getElementById('dt-title').style.textDecoration = p.done ? 'line-through' : '';
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('dt-pills').innerHTML = `
    <span class="pill pill-type" style="background:${type.color}22;color:${type.color};">${type.emoji} ${esc(p.underkat||type.navn)}</span>
    ${p.procestrin ? `<span class="pill pill-proc">${esc(p.procestrin)}</span>` : ''}
    ${p.deadline ? `<span class="pill pill-dl ${p.deadline<today?'late':''}">⏰ ${formatDate(p.deadline)}</span>` : ''}
    <span class="pill" style="background:${p.done?'#e6f9f1':'#f0f1f4'};color:${p.done?'#00a862':'#676879'};cursor:pointer;" onclick="toggleDone(${p.id})">${p.done?'✓ Færdig':'Markér færdig'}</span>
  `;

  const kids = children(p.id);
  document.getElementById('dt-kids-section').style.display = p.parentId ? 'none' : 'block';
  document.getElementById('dt-kids').innerHTML = !kids.length
    ? `<div style="font-size:12.5px;color:var(--text-dim);">Ingen delopgaver endnu</div>`
    : kids.map(k=>`<div class="kid-row ${k.done?'done':''}">
        <div class="kid-check" style="${k.done?`background:${getOpgaveType(k.type).color};border-color:transparent;`:''}" onclick="toggleDone(${k.id})">${k.done?'✓':''}</div>
        <div class="kid-title" onclick="openDetail(${k.id})">${esc(k.title)}</div>
        ${k.deadline?`<div class="kid-dl">${formatDate(k.deadline)}</div>`:''}
        <button class="kid-del" onclick="quickDeleteKid(${k.id})">✕</button>
      </div>`).join('');

  const lines = (p.notes||'').split('\n').filter(Boolean).reverse();
  document.getElementById('dt-notes').innerHTML = !lines.length
    ? `<div style="font-size:12.5px;color:var(--text-dim);">Ingen noter endnu</div>`
    : lines.map(line=>{
        const m = line.match(/^\[([^\]]+)\] (.+)$/);
        return `<div class="note-item">
          ${m?`<div class="note-ts">${esc(m[1])}</div><div class="note-text">${esc(m[2])}</div>`:`<div class="note-text">${esc(line)}</div>`}
        </div>`;
      }).join('');
  document.getElementById('dt-note-input').value = '';

  openSheet('ov-detail');
}
function quickDeleteKid(id){
  if(!confirm('Slet denne delopgave?')) return;
  state.projects = state.projects.filter(x=>x.id!==id);
  localStorage.setItem('nooty_mobile_cache', JSON.stringify(state));
  sbDelete(id);
  renderApp();
  if(_detailId) openDetail(_detailId);
}
function addNoteToDetail(){
  const input = document.getElementById('dt-note-input');
  const text = input.value.trim();
  if(!text || !_detailId) return;
  const p = state.projects.find(x=>x.id===_detailId);
  if(!p) return;
  const now = new Date();
  const ts = now.toLocaleDateString('da-DK',{day:'numeric',month:'short'}) + ' ' + now.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'});
  p.notes = p.notes ? p.notes + '\n' + `[${ts}] ${text}` : `[${ts}] ${text}`;
  persist(p);
  openDetail(_detailId);
  renderApp();
  toast('Note gemt ✓');
}

// ── Settings sheet ──
function openSettings(){
  document.getElementById('set-url').value = SUPABASE_URL;
  document.getElementById('set-key').value = SUPABASE_KEY;
  openSheet('ov-settings');
}
function saveSettings(){
  const url = document.getElementById('set-url').value.trim().replace(/\/$/,'');
  const key = document.getElementById('set-key').value.trim();
  if(!url || !key){ toast('Udfyld begge felter'); return; }
  SUPABASE_URL = url; SUPABASE_KEY = key;
  localStorage.setItem('fb_sb_url', url);
  localStorage.setItem('fb_sb_key', key);
  sbReady = true;
  document.getElementById('sb-dot').classList.add('ok');
  closeSheet('ov-settings');
  toast('Forbundet – henter opgaver...');
  loadFromSupabase(true);
}

// ── Sheet helpers ──
function openSheet(id){ document.getElementById(id).classList.add('open'); }
function closeSheet(id){ document.getElementById(id).classList.remove('open'); }

init();
</script>
</body>
